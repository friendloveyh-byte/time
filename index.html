<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>스마트팜 모니터링</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; background-color: #f4f4f9; margin-top: 100px; }
        h1 { color: #333; font-size: 2.5em; }
        .card-container { display: flex; justify-content: center; gap: 20px; margin-top: 40px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 200px; }
        .card h3 { margin: 0; color: #666; font-size: 1.2em; }
        .card p { font-size: 2em; font-weight: bold; color: #2ecc71; margin: 15px 0 0 0; }
        .status { margin-top: 30px; font-size: 1.2em; font-weight: bold; color: #3498db; }
    </style>
</head>
<body>

    <h1>🌱 스마트팜 실시간 현황</h1>
    
    <div class="card-container">
        <div class="card">
            <h3>현재 온도</h3>
            <p id="temp">-- °C</p>
        </div>
        <div class="card">
            <h3>현재 습도</h3>
            <p id="humi">-- %</p>
        </div>
    </div>

    <div class="status">통신 상태: <span id="conn-status">연결 대기 중...</span></div>

</body>
</html>
