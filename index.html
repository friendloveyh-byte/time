<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFarm 실시간 모니터링</title>
    <!-- 구글 폰트 & 스타일 -->
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f6f9; text-align: center; margin-top: 50px; }
        .card { background: white; width: 350px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 20px; }
        .status { font-size: 18px; font-weight: bold; margin: 15px 0; }
        .connected { color: #28a745; }
        .disconnected { color: #dc3545; }
        .value { font-size: 24px; color: #007bff; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🌱 SmartFarm 대시보드</h2>
        <div id="wifiStatus" class="status disconnected">연결 상태 확인 중...</div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <div>현재 연결된 SSID</div>
        <div id="ssidVal" class="value">-</div>
        <br>
        <div>하트비트 카운트</div>
        <div id="heartbeatVal" class="value">0</div>
    </div>

    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 본인의 파이어베이스 설정 정보 입력
        const firebaseConfig = {
            databaseURL: "https://smartfarm-3d275-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 파이어베이스 데이터 실시간 연동
        const wifiStatusEl = document.getElementById("wifiStatus");
        const ssidValEl = document.getElementById("ssidVal");
        const heartbeatValEl = document.getElementById("heartbeatVal");

        // SSID 실시간 감시
        db.ref("smartfarm/connection/wifi_ssid").on("value", (snapshot) => {
            const ssid = snapshot.val();
            if (ssid) {
                ssidValEl.innerText = ssid;
                wifiStatusEl.innerText = "🟢 ESP32 온라인 (연결됨)";
                wifiStatusEl.className = "status connected";
            } else {
                ssidValEl.innerText = "연결 안 됨";
                wifiStatusEl.innerText = "🔴 오프라인";
                wifiStatusEl.className = "status disconnected";
            }
        });

        // 하트비트 실시간 감시
        db.ref("smartfarm/heartbeat").on("value", (snapshot) => {
            const hb = snapshot.val();
            heartbeatValEl.innerText = hb !== null ? hb : 0;
        });
    </script>
</body>
</html>
